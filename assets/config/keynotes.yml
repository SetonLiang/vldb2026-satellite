  - speaker: "Volker Markl"
    affiliation: "Technical University of Berlin"
    photo: "keynote-volker-markl"
    when: ""
    title: "NebulaStream: Data Stream Processing for the Sensor-Edge-Cloud-Continuum"
    abstract: |
      Modern data-driven applications arising in such domains as smart manufacturing, healthcare, and the Internet of Things, pose new challenges to data processing systems. Traditional stream processing systems, such as Flink, Spark, and Kafka Streams are ill-suited to cope with the massive scale of distribution, the heterogeneous computing landscape, and requirements, such as timely processing and actuation. Classical approaches like managed runtimes, interpretation-based query processing, and the optimization of single queries that neglect interactions, greatly limit throughput, latency, energy-efficiency, and the general usability of these systems for emerging applications involving distributed data processing at scale in a sensor-edge-cloud-environment.

      To overcome these limitations, we are researching and building NebulaStream, a novel open-source data stream processing system for massively distributed, heterogeneous environments. NebulaStream supports (potentially resource-constrained) heterogeneous devices, a hierarchical topology (with the distribution of computation and data flow in a cloud-edge-continuum), and the sharing of computations and data across multiple concurrent queries. This presentation discusses the design goals and core concepts of NebulaStream and looks back at inspirations drawn from our prior work on Stratosphere and Apache Flink, among others.
    bio: |
      Volker Markl is a German Professor of Computer Science. He leads the Chair of Database Systems and Information Management at TU Berlin. In addition, he is Director of the Berlin Institute for the Foundations of Learning and Data (BIFOLD). He is a database systems researcher, conducting research at the intersection of distributed systems, scalable data processing, and machine learning. Volker led the Stratosphere project, which resulted in the creation of Apache Flink. Volker has received numerous honors and prestigious awards, including best paper awards at ACM SIGMOD, VLDB, and ICDE as well as the ACM SIGMOD Systems Award. In 2014, he was elected one of Germany's leading "Digital Minds" (Digitale Koepfe) by the German Informatics Society. He is a member of the Berlin-Brandenburg Academy of Sciences and of the German National Academy of Sciences Leopoldina. He was elected an ACM Fellow for his contributions to query optimization, scalable data processing, and data programmability. He served as President of the VLDB Endowment, and serves as advisor to academic institutions, governmental organizations, and technology companies. Volker holds eighteen patents and has been co-founder and mentor to several startups.
